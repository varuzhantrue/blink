spring:
  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/blink_test
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: integration-test-bucket

blink:
  rate-limit:
    upload:
      requests: 10
      window-seconds: 60
    download:
      requests: 30
      window-seconds: 60