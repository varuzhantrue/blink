services:
  blink-db:
    image: postgres:latest
    container_name: blink-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=blinkdb
    ports:
      - "5432:5432"
    volumes:
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d blinkdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  blink-minio:
    image: quay.io/minio/minio:latest
    container_name: blink-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_API_CORS_ALLOW_ORIGIN=http://localhost:5173
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  blink-redis:
    image: redis:7-alpine
    container_name: blink-redis
    ports:
      - "6379:6379"
    command: redis-server --save ""

  blink-redis-ui:
    image: redis/redisinsight:latest
    container_name: blink-redis-ui
    ports:
      - "5540:5540"
    depends_on:
      - blink-redis

  blink-app:
    build: .
    container_name: blink-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://blink-db:5432/blinkdb
      - DB_USERNAME=user
      - DB_PASSWORD=pass
      - MINIO_URL=http://blink-minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - SPRING_DATA_REDIS_HOST=blink-redis
    depends_on:
      blink-db:
        condition: service_healthy
      blink-minio:
        condition: service_started
      blink-redis:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: blink-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - blink-app